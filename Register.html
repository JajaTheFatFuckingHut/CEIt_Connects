<!DOCTYPE html>
<html lang="en">
<head>
    <title>CEIT Connects | Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .bg-image {
            background-image: url("resources/IMG_4804 2.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body class="vh-100 overflow-hidden">

<div class="container-fluid h-100 p-0">
    <div class="row h-100 g-0 m-0">

        <!-- LEFT IMAGE -->
        <div class="col-md-6 d-none d-md-block bg-image"></div>

        <!-- RIGHT FORM -->
        <div class="col-md-6 d-flex align-items-center justify-content-center bg-light">
            <div class="w-100 px-4" style="max-width: 420px;">

                <div class="text-center mb-4">
                    <img src="resources/logo3.png" alt="CEIT Connects Logo" class="mb-2" style="max-width:120px;">
                    <h2 class="fw-bold">CEIT CONNECTS</h2>
                    <p class="text-muted">Register</p>
                </div>

                <form action="/register" method="post">

                    <input type="text" class="form-control mb-3"
                           name="fullname" placeholder="Full Name" required>

                    <input type="text" class="form-control mb-3"
                           name="idnumber" placeholder="Student ID Number" required>

                    <select class="form-select mb-3" name="program" required>
                        <option selected disabled>Select Program</option>
                        <option>Civil Engineering</option>
                        <option>Information Technology</option>
                        <option>Electrical Engineering</option>
                    </select>

                    <div class="row mb-3">
                        <div class="col">
                            <select class="form-select" name="year" required>
                                <option selected disabled>Year</option>
                                <option>1st Year</option>
                                <option>2nd Year</option>
                                <option>3rd Year</option>
                                <option>4th Year</option>
                            </select>
                        </div>
                        <div class="col">
                            <select class="form-select" name="section" required>
                                <option selected disabled>Section</option>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <a href="#" class="small">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Register
                    </button>

                    <p class="text-center mt-3">
                        Already a member? <a href="Login.html">Login</a>
                    </p>

                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
